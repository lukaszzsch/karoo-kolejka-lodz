name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["pipeline/**", "docs/**", "*.md"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # karoo-ext ze źródeł (tag 1.1.9) do mavenLocal — CI nie potrzebuje tokena GitHub Packages.
      - name: karoo-ext 1.1.9
        run: |
          git clone --depth 1 --branch 1.1.9 https://github.com/hammerheadnav/karoo-ext.git "$RUNNER_TEMP/karoo-ext"
          cd "$RUNNER_TEMP/karoo-ext"
          ./gradlew -q :lib:publishToMavenLocal -Pgpr.user=ci -Pgpr.key=ci

      - name: Testy
        run: ./gradlew test

      # Stały klucz podpisu release (sekrety repo). Bez sekretów build przechodzi z kluczem debug.
      - name: Klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu KEYSTORE_BASE64 — release podpisany kluczem debug (każdy build inny podpis)"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
